name: ci

on:
  # `push` is scoped to main. A branch with an open PR is covered by the
  # `pull_request` trigger below, so listening to every push ran the SAME tree
  # twice — see the concurrency note.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# De-dupe concurrent runs for the same COMMIT.
#
# The previous key was `${{ github.workflow }}-${{ github.ref }}`, and its
# comment described exactly the bug it failed to prevent: a push to a branch
# that ALSO has an open PR fires TWO full 5-job matrices which contend on the
# checkout-prereq step and can report contradictory results for an identical
# tree (a 19s "build failure" in one while the other builds green in ~2 min).
#
# The key could never catch that. `push` and `pull_request` carry DIFFERENT
# refs for the same commit — measured on PR #96 @62ac0ee:
#     event=push          head_branch=agent/serve-image-tag-epoch
#     event=pull_request  head_branch=#96
# Different refs -> different groups -> the de-dupe never fires. 10 runs for
# one commit, every commit: double the load on the shared 8-runner `docker`
# pool, and the contention the comment warns about, permanently on.
#
# Two changes, both needed:
#   1. `push` restricted to main, so branch pushes no longer duplicate the
#      PR run. This alone removes the double matrix.
#   2. Group on `github.sha` instead of `github.ref`, so if the two events
#      ever coincide again (e.g. a push to main that is also a PR head) they
#      share one group and de-dupe for real. Belt and braces: (1) is the fix,
#      (2) is the guard that stays correct if the triggers change.
#
# cancel-in-progress is FALSE, matching the repo axiom "never cancel
# in-progress, only collapse the queue" (tf-multiverse enforces the same rule
# repo-wide in scripts/ci/check-no-cancel-in-progress.sh).
#
# An earlier revision of this comment argued TRUE was safe here, reasoning that
# a commit-keyed group can only cancel a redundant matrix for the SAME sha.
# Change (1) is what makes that nearly true — and "nearly" is the problem. One
# case survives: a commit that is simultaneously on main (push) AND the head of
# an open PR into main (pull_request). Both events then land in the same
# sha-keyed group, and TRUE lets the later one preempt the earlier. A cancelled
# Forgejo run never re-reports, so the preempted context is permanently
# not-green — an unsatisfiable gate on the exact commit someone is trying to
# land. Rare, self-inflicted, and unrecoverable without a re-push.
#
# FALSE loses nothing. `concurrency.group` alone still coalesces: a newer run
# QUEUES behind the active one instead of killing it. The load win here was
# never cancellation — it came from change (1) below (measured: 10 jobs per
# commit before, 5 after). Cancellation was only ever trimming the duplicate
# that (1) already stopped creating.
#
# Note a Forgejo quirk if this is ever revisited: an EXPRESSION-valued
# cancel-in-progress is treated as TRUTHY whatever it evaluates to, so the
# literal `false` is the only safe spelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

# Every job gets a fresh 16 GiB runner scratch volume, so incremental state is
# never reused across runs. Full DWARF plus incremental artifacts filled that
# volume in both `cargo build --all-targets` and `cargo test` on 2026-08-04,
# turning a green tree into linker and tempfile ENOSPC reds. Keep source-level
# panic locations while dropping the heavyweight build artifacts CI discards.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

# Split into one job per check. This Forgejo build does not expose run/job
# logs over the REST API, so job *granularity* is our only failure
# observability: a red `fmt` job vs a red `build` job is diagnosable from
# /api/v1/.../actions/tasks alone.
#
# These jobs use the dedicated `cargoless-ci` runner label. Forgejo schedules
# strict FIFO per shared label; a large tf-multiverse fan-out can otherwise
# leave this repository waiting behind hundreds of unrelated `docker` jobs.
# The GitOps-managed FSN ordinal for this label is deliberately separate from
# tf-multiverse's thin-poller `witness` and operator-only `priority` lanes.
#
# Every job repeats a setup step that installs nodejs BEFORE actions/checkout
# runs: checkout@v4 is a JS action executed inside `container:`, and the
# rust-1.85-bookworm image ships no node. The image is always addressed through
# the shared registry mirror: the runner fleet's GC pins that namespace, while
# an unmirrored Docker Hub tag can be pruned between pull and container-create
# and fail an otherwise healthy job with `No such image`. tf-multiverse's own
# ci.yml documents this exact gotcha for its alpine jobs. `safe.directory` avoids git's
# dubious-ownership refusal when the root-owned container checks out the tree.
#
# Cargo.lock IS committed. The zero-external-deps era ended when daemon-core
# added `notify` (cargoless-core, was `tf-core` pre-#97) for the FS watcher;
# the workspace now has a real resolved graph. A committed lock + `--locked`
# makes the dependency graph a deterministic, reviewable input — which is
# also exactly what the contract already promised
# (`cargoless_proto::BuildIdentity.cargo_lock` hashes Cargo.lock as
# part of the artifact identity; module path was `tf_proto::` pre-#97). `--locked` additionally makes CI fail loud
# if Cargo.lock drifts from Cargo.toml instead of silently re-resolving. fmt
# does not resolve deps so it omits `--locked`; bench drives bench/run.sh.

jobs:
  build:
    runs-on: cargoless-ci
    container:
      image: registry.triform.cloud/mirror/rust-1.85-bookworm:latest
    steps:
      - name: Setup (node for checkout + git safe.dir)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: rustc --version && cargo --version
      - run: cargo build --workspace --all-targets --locked

  test:
    runs-on: cargoless-ci
    container:
      image: registry.triform.cloud/mirror/rust-1.85-bookworm:latest
    steps:
      - name: Setup (node for checkout + git safe.dir)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # `--no-fail-fast` so ONE failing binary does not hide every later one.
      #
      # Without it, `cargo test --workspace` stops at the first test binary that
      # fails, and the known ~1/357 warm-target flake lives in the `cargoless`
      # unit tests — which run BEFORE `cargoless-core`'s integration tests. So
      # every time that flake fires, the whole lane suite silently never
      # executes and the job reports one failure that says nothing about the
      # other crates. Observed twice in a row on 2026-08-02, each run masking
      # whether a new lane test passed at all.
      #
      # A flake that hides real signal is worse than a flake. This costs one
      # extra run of the remaining binaries on a red and buys an honest answer
      # about every crate on every run.
      - run: cargo test --workspace --locked --no-fail-fast

  # The lane decides who gets blamed for a red build, and tests/lane_policy.rs is
  # the only thing between that policy and an unjust ejection. This job proves
  # the suite can actually FAIL: it breaks the attribution four ways and asserts
  # the tests catch each one. A suite that passes on broken code converts
  # "unverified" into "verified" — this repo's documented failure mode.
  #
  # Separate from `test` deliberately: it rewrites lane.rs in the workspace, and
  # a job that mutates source must never share a checkout with one reporting a
  # verdict on it.
  lane-mutation:
    name: lane policy mutation proof
    runs-on: cargoless-ci
    container:
      image: registry.triform.cloud/mirror/rust-1.85-bookworm:latest
    steps:
      - name: Setup (node for checkout + git safe.dir)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs python3
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python3 scripts/tests/workflow-container-image-policy-test.py
      - run: bash scripts/tests/lane-attribution-mutation-test.sh
      - run: bash scripts/tests/mirror-verify-test.sh
      # Static, <1s, no build: asserts a computed reason actually reaches the
      # wire. --self-test first, so a guard that has quietly stopped being able
      # to fail is caught before its PASS is believed.
      - run: bash scripts/tests/explanation-reaches-the-wire-test.sh --self-test
      - run: bash scripts/tests/explanation-reaches-the-wire-test.sh

  fmt:
    runs-on: cargoless-ci
    container:
      image: registry.triform.cloud/mirror/rust-1.85-bookworm:latest
    steps:
      - name: Setup (node for checkout + git safe.dir)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: cargoless-ci
    container:
      image: registry.triform.cloud/mirror/rust-1.85-bookworm:latest
    steps:
      - name: Setup (node for checkout + git safe.dir)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  bench:
    name: rust-analyzer latency harness (S1 / AC#2)
    runs-on: cargoless-ci
    container:
      image: registry.triform.cloud/mirror/rust-1.85-bookworm:latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Setup (node for checkout + git safe.dir)
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends nodejs
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: S1/AC#2 harness + publish verdict as commit status
        # CI logs are not API-readable on this Forgejo, so the harness's single
        # `^S1_VERDICT:` line is lifted into a commit status (which IS readable
        # via GET /repos/.../commits/<sha>/statuses). run.sh always exits 0
        # (evidence, not a gate) so an honest "sub-1s impossible" never reds main.
        env:
          FJ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -x bench/run.sh ]; then
            bench/run.sh 2>&1 | tee /tmp/s1.out || true
          else
            echo "S1_VERDICT: BLOCKER=harness-binary-missing AC2=UNKNOWN D-A2=BLOCKED" | tee /tmp/s1.out
          fi
          V=$(grep -m1 '^S1_VERDICT:' /tmp/s1.out || echo 'S1_VERDICT: BLOCKER=no-verdict-line AC2=UNKNOWN D-A2=BLOCKED')
          echo "Publishing commit status: $V"
          BODY=$(printf '%s' "$V" | python3 -c 'import json,sys; print(json.dumps({"state":"success","context":"s1-ac2-verdict","description":sys.stdin.read().strip()[:255]}))')
          # D-CI-RESILIENCE F-E (HARDEN-NOW): the verdict PRODUCER must not
          # fail silently. run.sh's exit-0 evidence-not-a-gate semantics
          # are preserved (an honest "sub-1s impossible" still never reds
          # main — V above is published as-is). But the POST itself failing
          # (transport error or non-2xx, e.g. token scope/Forgejo down)
          # means the s1-ac2-verdict was NOT published — a real infra
          # failure that silently breaks every later tag-validate. Make it
          # LOUD: red `main` at commit time instead of surprising the
          # operator at tag time. Distinguish transport vs HTTP for triage.
          HTTP=$(curl -sS -X POST \
            -H "Authorization: token ${FJ_TOKEN}" -H "Content-Type: application/json" \
            "https://forgejo.triform.dev/api/v1/repos/triform/cargoless/statuses/${GITHUB_SHA}" \
            -d "$BODY" -o /tmp/s1resp.json -w '%{http_code}') \
            || { echo "::error::s1-ac2-verdict POST: curl transport failure (Forgejo unreachable from CI?) — verdict NOT published"; exit 1; }
          echo "status-post HTTP $HTTP"
          head -c 300 /tmp/s1resp.json 2>/dev/null || true; echo
          case "$HTTP" in
            2[0-9][0-9]) echo "s1-ac2-verdict published ✓ ($HTTP)" ;;
            *) echo "::error::s1-ac2-verdict POST returned HTTP $HTTP — verdict NOT published (token scope? endpoint? auth?). Failing loud (D-CI-RESILIENCE F-E): a silently-unpublished verdict breaks every later release tag-validate."; exit 1 ;;
          esac
