[package]
name = "cargoless-core"
version.workspace = true  # CWDL-71 Phase B: inherits from [workspace.package]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The cargoless daemon: filesystem watcher, rust-analyzer wrapper, green/red model, build orchestration."

[lints]
workspace = true

[dependencies]
cargoless-proto = { path = "../cargoless-proto", version = "0.4.0" }  # publish-ready
cargoless-cas = { path = "../cargoless-cas", version = "0.4.0" }      # publish-ready
# Owner-added (daemon-core, Epic 2). notify 6.x: stable cross-platform FS
# backend (inotify/FSEvents/kqueue/ReadDirectoryChangesW), MSRV well under
# 1.85. Debounce + ignore are implemented in-crate (pure, unit-tested) rather
# than pulling notify-debouncer-* / the ignore crate, keeping the dep tree
# minimal for the CI-only build model.
notify = "6"
# Native TLS keeps the hand-rolled HTTP adapter small while allowing the CLI
# to connect directly to HTTPS ingress endpoints.
native-tls = "0.2"
# Gzip is used only for large JSON request bodies before they hit the fixed
# HTTP body cap; the daemon still bounds both encoded and decoded sizes.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Owner-added (daemon-core, Epic 2 / CWDL #4). serde_json for LSP JSON-RPC:
# we emit controlled requests but must robustly parse rust-analyzer's
# publishDiagnostics (nested arrays, escaped strings) — hand-rolled JSON there
# is a latent-bug factory. Candidate result-v2 and evidence inventories also
# need closed typed envelopes, so serde derive is now a direct core dependency.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
